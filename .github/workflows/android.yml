name: Android widget APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test and build debug APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace

      - name: Publish APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DisciplineLedger.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest DisciplineLedger.apk \
            --title "Android widget (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download DisciplineLedger.apk on the phone and install it." \
            --prerelease
